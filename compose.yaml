services:
  redis:
    image: redis:latest
    container_name: llm-engineer-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
  db:
    image: pgvector/pgvector:pg16
    container_name: llm-engineer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_engineer
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
