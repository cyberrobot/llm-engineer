[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # optional (line length handled separately)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "pysbd"
ignore_missing_imports = true

[project]
requires-python = ">=3.12,<3.13"
