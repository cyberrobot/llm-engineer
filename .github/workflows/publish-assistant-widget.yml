name: Release assistant widget

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Verify and release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint widget
        run: npm run lint --workspace @redmoor/assistant-widget

      - name: Test widget
        run: npm run test --workspace @redmoor/assistant-widget

      - name: Build widget
        run: npm run build --workspace @redmoor/assistant-widget

      - name: Verify package
        run: npm run pack:verify --workspace @redmoor/assistant-widget

      - name: Create release pull request or publish widget
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
