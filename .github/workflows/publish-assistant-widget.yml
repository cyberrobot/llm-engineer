name: Publish assistant widget

on:
  push:
    tags:
      - 'assistant-widget-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing assistant widget release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name) }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        shell: bash
        run: |
          node <<'NODE'
          const { version } = require('./apps/assistant/package.json')
          const tag = process.env.RELEASE_TAG
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/

          if (!semver.test(version)) {
            throw new Error(`Invalid package version: ${version}`)
          }

          if (tag !== `assistant-widget-v${version}`) {
            throw new Error(`Release tag ${tag} does not match package version ${version}`)
          }

          console.log(`Validated ${tag} for @redmoor/assistant-widget@${version}`)
          NODE

      - name: Lint widget
        run: npm run lint --workspace @redmoor/assistant-widget

      - name: Test widget
        run: npm run test --workspace @redmoor/assistant-widget

      - name: Build widget
        run: npm run build --workspace @redmoor/assistant-widget

      - name: Verify package
        run: npm run pack:verify --workspace @redmoor/assistant-widget

      - name: Publish widget
        run: npm publish --workspace @redmoor/assistant-widget --provenance --access public
