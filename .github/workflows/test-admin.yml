name: Admin UI CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'packages/assistant-widget/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-admin.yml'
      - '.github/workflows/test-admin-required.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'packages/assistant-widget/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-admin.yml'
      - '.github/workflows/test-admin-required.yml'

jobs:
  admin:
    name: Admin validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Admin CI workflow
        run: npm run verify:ci --workspace @ai-discovery-assistant/admin

      - name: Test Admin
        run: npm test --workspace @ai-discovery-assistant/admin

      - name: Lint Admin
        run: npm run lint --workspace @ai-discovery-assistant/admin

      - name: Typecheck Admin
        run: npm run typecheck --workspace @ai-discovery-assistant/admin

      - name: Build Admin
        run: npm run build --workspace @ai-discovery-assistant/admin

      - name: Build Admin Storybook
        run: npm run build-storybook --workspace @ai-discovery-assistant/admin
