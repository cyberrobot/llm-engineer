name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  assistant-widget:
    name: Assistant widget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check for widget-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            affected:
              - 'packages/assistant-widget/**'
              - '.changeset/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
              - '.github/workflows/publish-assistant-widget.yml'

      - name: Check out repository
        if: >-
          github.event_name == 'push' ||
          steps.filter.outputs.affected == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        if: >-
          github.event_name == 'push' ||
          steps.filter.outputs.affected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: >-
          github.event_name == 'push' ||
          steps.filter.outputs.affected == 'true'
        run: npm ci

      - name: Require a Changeset for package changes
        if: >-
          github.event_name == 'pull_request' &&
          steps.filter.outputs.affected == 'true' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.head.ref != 'changeset-release/main')
        run: npx changeset status --since=${{ github.event.pull_request.base.sha }}

      - name: Lint widget
        if: >-
          github.event_name == 'push' ||
          steps.filter.outputs.affected == 'true'
        run: npm run lint --workspace @redmoor/assistant-widget

      - name: Test widget
        if: >-
          github.event_name == 'push' ||
          steps.filter.outputs.affected == 'true'
        run: npm run test --workspace @redmoor/assistant-widget

      - name: Build widget
        if: >-
          github.event_name == 'push' ||
          steps.filter.outputs.affected == 'true'
        run: npm run build --workspace @redmoor/assistant-widget

      - name: Verify package
        if: >-
          github.event_name == 'push' ||
          steps.filter.outputs.affected == 'true'
        run: npm run pack:verify --workspace @redmoor/assistant-widget

  pytest:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_discovery_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_discovery_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_discovery_assistant
      KNOWLEDGE_SOURCE_POSTGRES_REQUIRED: "true"
      KNOWLEDGE_PERSISTENCE_POSTGRES_REQUIRED: "true"
      ASSISTANT_BEHAVIOUR_POSTGRES_REQUIRED: "true"
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest

      - name: Run required knowledge-source PostgreSQL tests without skips
        run: >-
          pytest -q -o "addopts=" --strict-markers
          tests/test_knowledge_source_postgres_migration.py
          tests/test_knowledge_source_repository_postgres_integration.py
          tests/test_knowledge_source_api_postgres_integration.py

      - name: Run required knowledge-persistence PostgreSQL tests without skips
        run: >-
          pytest -q -o "addopts=" --strict-markers
          tests/test_knowledge_persistence_integration.py

      - name: Run required Assistant behaviour PostgreSQL tests without skips
        run: >-
          pytest -q -o "addopts=" --strict-markers
          tests/test_assistant_behaviour_postgres.py
          tests/test_migrations.py

  storybook-tests:
    name: Storybook tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Storybook test browsers
        run: npm run install-storybook-browsers --workspace @ai-discovery-assistant/rag-ui

      - name: Run Storybook tests
        run: npm run test:storybook
