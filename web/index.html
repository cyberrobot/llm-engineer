<!doctype html>
<html>
  <head>
    <title>RAG Demo</title>
  </head>
  <body>
    <h1>RAG Assistant</h1>

    <input id="query" placeholder="Ask something..." style="width: 400px" />
    <button onclick="ask()">Ask</button>

    <h2>Answer</h2>
    <div id="answer"></div>

    <h2>Sources</h2>
    <div id="sources"></div>

    <h2>Debug</h2>
    <pre id="debug"></pre>

    <script>
      async function ask() {
        const query = document.getElementById('query').value;

        const res = await fetch('http://localhost:8000/rag-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: query,
            user_role: 'doctor',
          }),
        });

        const data = await res.json();

        document.getElementById('answer').innerText = data.reply;

        document.getElementById('sources').innerHTML = data.sources
          .map((s) => `<p>- ${s.text}</p>`)
          .join('');

        document.getElementById('debug').innerText = JSON.stringify(
          data,
          null,
          2,
        );
      }
    </script>
  </body>
</html>
